stages:
  - build
  - release

build-container:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$(echo -n ${GITHUB_USERNAME}:${GITHUB_TOKEN} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context ${CI_PROJECT_DIR}
      --dockerfile ${CI_PROJECT_DIR}/Dockerfile
      --destination ghcr.io/mjfi2sb3/kmer-gwas-cpp:${CI_COMMIT_TAG}
  rules:
    - if: $CI_COMMIT_TAG

# Compile the standalone helper tools as STATIC binaries and attach them to the
# Release, so a user can download a ready-to-run copy without running the pipeline
# or building the image. Static so they run on an HPC login node or a laptop
# regardless of its glibc / libstdc++ version. Both are single-file, k-agnostic
# utilities (kbin_dump reads a pack's k from its footer).
build-tools:
  stage: build
  image: gcc:12
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update && apt-get install -y zlib1g-dev
    - g++ -std=c++17 -O2 -pthread -static -o kbin_dump    src/kbin_dump.cpp -lz
    - g++ -std=c++17 -O2 -static -o bits_to_text src/bits_to_text.cpp -lz
    - ldd ./kbin_dump 2>&1 || true       # expect "not a dynamic executable"
    - ./kbin_dump --help > /dev/null && echo "kbin_dump built"
  artifacts:
    paths:
      - kbin_dump
      - bits_to_text
    expire_in: never

# Release notes for the tag: the "## <tag>" section of CHANGELOG.md (up to the
# next "## "), written to release_notes.md. A one-line text is used if the
# section is not found.
.changelog-notes:
  script:
    - |
      notes="$(awk -v t="## ${CI_COMMIT_TAG}" '
        $0==t {f=1; next}
        f && /^## / {exit}
        f {print}
      ' CHANGELOG.md)"
      if [ -z "$notes" ]; then
        notes="Release ${CI_COMMIT_TAG}. See CHANGELOG.md."
      fi
      printf '%s\n' "$notes" > release_notes.md

# Create a GitLab Release for the tag, once the image has built. The release
# notes are the matching section of CHANGELOG.md, extracted at build time so the
# Release page and the changelog cannot drift apart.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-container
    - build-tools
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - !reference [.changelog-notes, script]
    - echo "----- release notes -----"; cat release_notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    assets:
      links:
        - name: "kbin_dump (x86-64 Linux, static)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/kbin_dump?job=build-tools"
          link_type: other
        - name: "bits_to_text (x86-64 Linux, static)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/bits_to_text?job=build-tools"
          link_type: other

# Create the matching GitHub release, with the same notes and the two static
# tools as files. GITHUB_TOKEN needs write access to the repository contents.
# Safe to run again: an existing release is reused, and a file of the same
# name is replaced.
github-release:
  stage: release
  image: alpine:3.20
  needs:
    - build-container
    - build-tools
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GH_REPO: mjfi2sb3/kmer-gwas-cpp
  script:
    - apk add --no-cache curl jq
    - !reference [.changelog-notes, script]
    - |
      api() { curl -sS --fail-with-body \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
      base="https://api.github.com/repos/${GH_REPO}"

      # The tag reaches GitHub through the push mirror. Wait up to 10 minutes.
      i=0
      until api -o /dev/null "${base}/git/ref/tags/${CI_COMMIT_TAG}" 2>/dev/null; do
        i=$((i + 1))
        if [ "$i" -ge 30 ]; then echo "Tag ${CI_COMMIT_TAG} is not on GitHub after 10 minutes."; exit 1; fi
        sleep 20
      done

      # Use the release if it exists; otherwise create it.
      id="$(api "${base}/releases/tags/${CI_COMMIT_TAG}" 2>/dev/null | jq -r '.id // empty')" || id=""
      if [ -z "$id" ]; then
        id="$(jq -n --arg t "${CI_COMMIT_TAG}" --rawfile b release_notes.md \
                '{tag_name: $t, name: ("Release " + $t), body: $b}' \
              | api -X POST -d @- "${base}/releases" | jq -r '.id // empty')"
      fi
      if [ -z "$id" ]; then echo "Could not create the GitHub release."; exit 1; fi

      # Upload the tools. A file of the same name is replaced.
      for f in kbin_dump bits_to_text; do
        old="$(api "${base}/releases/${id}/assets" | jq -r --arg n "$f" '.[] | select(.name == $n) | .id')"
        if [ -n "$old" ]; then api -X DELETE "${base}/releases/assets/${old}"; fi
        api -o /dev/null -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@${f}" \
            "https://uploads.github.com/repos/${GH_REPO}/releases/${id}/assets?name=${f}"
        echo "Uploaded ${f}"
      done
